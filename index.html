      height: 100%;
      width: 100%;
      overflow: hidden;
      margin: 0;
      padding: 0;

      left: 0;
      top: 0;
      right: 0;
      bottom: 0;
    }

    .safe-area-top-spacer {
      padding-top: max(25px, var(--sat));
    }

    .safe-area-bottom {
      padding-bottom: var(--sab);
    }

    #root {
      height: 100%;
      width: 100%;
    }

    .cartoon-box {
      background-color: white;
      border: 3px solid #000;
      box-shadow: 4px 4px 0px 0px #000;
      border-radius: 1rem;
    }

    .cartoon-btn {
      background-color: #FFD700;
      color: black;
      font-weight: 800;
      border: 3px solid #000;
      box-shadow: 3px 3px 0px 0px #000;
      border-radius: 0.75rem;
      text-transform: uppercase;
      transition: all 0.1s ease;
      cursor: pointer;
    }

    .cartoon-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px 0px #000;
    }

    .cartoon-btn:disabled {
      background-color: #E5E7EB;
      color: #9CA3AF;
      box-shadow: none;
      transform: none;
      cursor: not-allowed;
    }

    .cartoon-btn.secondary {
      background-color: #87CEEB;
    }

    .cartoon-btn.danger {
      background-color: #FF6B6B;
    }

    .option-btn:active {
      transform: scale(0.98);
    }

    .cartoon-input {
      border: 3px solid #000;
      border-radius: 0.75rem;
      padding: 0.75rem;
      font-weight: 600;
      outline: none;
      background: #fff;
    }

    .cartoon-input:focus {
      background-color: #FFFACD;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .safe-area-bottom {
      padding-bottom: env(safe-area-inset-bottom);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in {
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes bounceIn {
      0% {
        opacity: 0;
        transform: scale(0.9);
      }

      70% {
        opacity: 1;
        transform: scale(1.05);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .animate-bounce-in {
      animation: bounceIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Tag Styles */
    .tag-chip {
      font-size: 0.7rem;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      border: 2px solid black;
      cursor: pointer;
      margin-right: 4px;
      display: inline-block;
    }

    .tag-pic {
      background-color: #FED7AA;
    }

    /* Orange-200 */
    .tag-result {
      background-color: #BBF7D0;
    }

    /* Green-200 */

    /* Selection Styles */
    .selected-card {
      border-color: #FFD700 !important;
      box-shadow: 0 0 0 4px #FFD700 !important;
    }

    .check-circle {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: white;
      border: 2px solid black;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .check-circle.checked {
      background: #FFD700;
    }

    /* Prevent text selection during long press */
    .noselect {
      -webkit-touch-callout: none;
      /* iOS Safari */
      -webkit-user-select: none;
      /* Safari */
      -khtml-user-select: none;
      /* Konqueror HTML */
      -moz-user-select: none;
      /* Old versions of Firefox */
      -ms-user-select: none;
      /* Internet Explorer/Edge */
      user-select: none;
      /* Non-prefixed version, currently supported by Chrome, Edge, Opera and Firefox */
    }

    /* Toggle Switch */
    .toggle-checkbox:checked {
      right: 0;
      border-color: #68D391;
    }

    .toggle-checkbox:checked+.toggle-label {
      background-color: #68D391;
    }

      white-space: pre-wrap;

      font-family: monospace;

      padding: 0.5rem;
      border-radius: 0.5rem;
      border: 1px solid #e5e7eb;
      max-height: 300px;
      overflow-y: auto;
    }
  </style>
</head>

    function randomString(length) {
      const chars = '0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
      let result = '';
      for (let i = length; i > 0; --i) result += chars[Math.floor(Math.random() * chars.length)];

    function genUpToken(accessKey, secretKey, bucket) {
      const policy = { scope: bucket, deadline: Math.floor(Date.now() / 1000) + 3600 };
      const putPolicy = JSON.stringify(policy);
      const encodedPutPolicy = CryptoJS.enc.Base64.stringify(CryptoJS.enc.Utf8.parse(putPolicy)).replace(/\+/g, '-').replace(/\//g, '_');
      const sign = CryptoJS.HmacSHA1(encodedPutPolicy, secretKey);
      const encodedSign = sign.toString(CryptoJS.enc.Base64).replace(/\+/g, '-').replace(/\//g, '_');
      return accessKey + ':' + encodedSign + ':' + encodedPutPolicy;
    }

          reader.onloadend = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });

        if (typeof file === 'string' && file.startsWith('http')) {
          resolve(file);

          const key = `${randomString(8)}_${file.name}`;
          const formData = new FormData();
          formData.append('token', token);
          formData.append('file', file);
          formData.append('key', key);

          const xhr = new XMLHttpRequest();
          xhr.open('POST', config.qiniuUploadUrl, true);
          xhr.onload = function () {
            if (xhr.status === 200) {
              const res = JSON.parse(xhr.responseText);
              const finalUrl = `http://${config.qiniuDomain}/${res.key}`;
              console.log("Upload success:", finalUrl);
              resolve(finalUrl);
            } else {
              console.error("Qiniu Upload Failed:", xhr.responseText);
              resolve(URL.createObjectURL(file));
            }
          };
          xhr.onerror = function () { console.error("Qiniu Network Error"); resolve(URL.createObjectURL(file)); };
          xhr.send(formData);
        } catch (e) { console.error("Token Gen Error:", e); resolve(URL.createObjectURL(file)); }
      });
    };

    const cleanVisionResponse = (text) => {
      if (!text) return "";
      let cleaned = text.replace(/<think>[\s\S]*?<\/think>/g, '').trim();
      cleaned = cleaned
        .replace(/坐标\s*[\(（][\d\.\s,，]+[\)）]/g, '')
        .replace(/位于图片.*?的/g, '')
        .replace(/^\s*\+\s*/, '')
        .replace(/^[\s,，]+/, '')
        .trim();
      return cleaned;
    };

    const callVisionModel = async (imageUrl, promptText, config) => {
      if (imageUrl.startsWith('blob:') || imageUrl.startsWith('mock-')) {
        await new Promise(r => setTimeout(r, 1500));
        return "Mock: 画面左侧的红色椅子";
      }
      try {
        const response = await fetch(config.visionUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${config.apiKey}` },
          body: JSON.stringify({ model: config.visionModel || "gemini-3-pro", messages: [{ role: "user", content: [{ type: "text", text: promptText }, { type: "image_url", image_url: { url: imageUrl } }] }] })
        });
        const data = await response.json();
        if (data.error) throw new Error(data.error.message);
        const rawContent = data.choices[0].message.content;
        return cleanVisionResponse(rawContent);
      } catch (error) {
        return "识别失败";
      }
    };

    const translateText = async (text, config) => {
      if (!config.enableTranslate || !text) return text;
      try {
        const response = await fetch(config.visionUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${config.apiKey}` },
          body: JSON.stringify({
            model: config.visionModel || "gemini-3-pro",
            messages: [
              { role: "system", content: config.translatePrompt },
              { role: "user", content: text }
            ]
          })
        });
        const data = await response.json();
        if (data.error) throw new Error(data.error.message);
        let translated = data.choices[0].message.content.trim();
        translated = translated.replace(/<think>[\s\S]*?<\/think>/g, '').trim();
        console.log(`Translated: "${text}" -> "${translated}"`);
        return translated;
      } catch (error) {
        console.warn("Translation failed, using original text:", error);
        return text;
      }
    };

    // Global cache for sync results (Model 2)
    window._task_results_cache = window._task_results_cache || {};

    const submitDrawTask = async (prompt, aspectRatio, imageSize, imageUrls = [], config, baseImage = null) => {
      try {
        // --- MODEL 2 Logic ---
        if (config.activeModel === 'model2') {
          const modelId = imageSize === '4K' ? (config.drawModel2_model_4k || "gemini-3-pro-image-preview-4k") : (config.drawModel2_model_2k || "gemini-3-pro-image-preview-2k");

          // Append Aspect Ratio to prompt for Model 2
          const promptWithRatio = `${prompt} --ar ${aspectRatio}`;
          let content = [{ type: "text", text: promptWithRatio }];

          // Add referenced images (Img2Img / Transfer)
          if (Array.isArray(imageUrls)) {
            imageUrls.forEach(url => {
              content.push({ type: "image_url", image_url: { url: url } });
            });
          }

          // Add base image if exists (Inpaint base)
          if (baseImage && (baseImage.preview || baseImage.url)) {
            content.push({ type: "image_url", image_url: { url: baseImage.preview || baseImage.url } });
          }

          // Simplify payload for text-only requests to avoid "Code Assist" routing on some proxies
          let finalContent = content;
          if (content.length === 1 && content[0].type === 'text') {
            finalContent = content[0].text;
          }

          const payload = {
            model: modelId,
            messages: [{ role: "user", content: finalContent }]
          };

          console.log("Model 2 Payload:", payload);
          const response = await fetch(config.drawModel2_submitUrl.trim(), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${config.drawModel2_apiKey.trim()}` },
            body: JSON.stringify(payload)
          });

          if (!response.ok) {
            const errorText = await response.text();
            let errorMsg = errorText.substring(0, 300);
            try {
              const errJson = JSON.parse(errorText);
              if (errJson.error && errJson.error.message) errorMsg = errJson.error.message;
            } catch (e) { }
            throw new Error(`Provider Error (${response.status}): ${errorMsg}`);
          }

          const data = await response.json();
          const resultText = data.choices?.[0]?.message?.content || "";

          // Try to extract URL if it's in markdown format or just text
          const urlMatch = resultText.match(/https?:\/\/[^\s\)]+/);
          const resultUrl = urlMatch ? urlMatch[0] : `https://placehold.co/1024x1024?text=${encodeURIComponent(resultText.substring(0, 20))}`;

          const tempId = "direct-" + Date.now();
          window._task_results_cache[tempId] = resultUrl;
          return tempId;
        }

        // --- MODEL 1 Logic ---
        let finalPrompt = prompt;
        if (baseImage) {
          const n = imageUrls.length + 1;
          finalPrompt = `Edit Image ${n} ${prompt}`;
        }

        const payload = { model: config.drawModel || "nano-banana-pro", prompt: finalPrompt, aspectRatio, imageSize, urls: imageUrls, base_image: baseImage, webHook: "-1", shutProgress: false };
        console.log("Submitting Payload:", payload);

        const response = await fetch(config.submitUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${config.apiKey}` },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          throw new Error(`Submit Failed: ${response.status} ${response.statusText}`);
        }

        const data = await response.json();
        if (data.code !== 0) throw new Error(data.msg || "API Error");
        return data.data.id;
      } catch (error) {
        if (error.message.includes("insufficient credits") || error.message.includes("余额")) {
          console.warn("API 余额不足，自动切换到演示模式");
          return "mock-" + Date.now();
        }
        throw error;
      }
    };

    const getEffectiveModel = (config, size) => {
      if (config.activeModel === 'model2') {
        return size === '4K' ? (config.drawModel2_model_4k || "gemini-3-pro-image-preview-4k") : (config.drawModel2_model_2k || "gemini-3-pro-image-preview-2k");
      }
      return config.drawModel || "nano-banana-pro";
    };

    const pollTaskResult = async (taskId, onProgress, config) => {
      // Model 2 Support
      if (typeof taskId === 'string' && taskId.startsWith("direct-")) {
        if (window._task_results_cache && window._task_results_cache[taskId]) {
          if (onProgress) onProgress(100);
          return window._task_results_cache[taskId];
        }
      }
      if (taskId.toString().startsWith("mock-")) {
        return new Promise((resolve) => {
          let p = 0;
          const interval = setInterval(() => { p += 20; if (onProgress) onProgress(p); if (p >= 100) { clearInterval(interval); resolve(`https://picsum.photos/seed/${taskId}/1024/1024`); } }, 800);
        });
      }
      return new Promise((resolve, reject) => {
        const startTime = Date.now();
        const timeoutLimit = 500000;
        let errorCount = 0;

        const interval = setInterval(async () => {
          if (Date.now() - startTime > timeoutLimit) {
            clearInterval(interval);
            reject(new Error("任务超时 (500s)"));
            return;
          }
          try {
            const response = await fetch(config.resultUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${config.apiKey}` },
              body: JSON.stringify({ id: taskId })
            });

            if (!response.ok) {
              throw new Error(`HTTP ${response.status}`);
            }

            const res = await response.json();
            errorCount = 0;

            if (res.code === 0) {
              const status = res.data.status;
              const progress = res.data.progress || 0;
              if (onProgress) onProgress(progress);
              if (status === 'succeeded') { clearInterval(interval); resolve(res.data.results[0].url); }
              else if (status === 'failed') { clearInterval(interval); reject(new Error(res.data.failure_reason || "任务失败")); }
            }
          } catch (e) {
            console.error("Polling error", e);
            errorCount++;
            if (errorCount > 5) {
              clearInterval(interval);
              reject(new Error("网络连接失败或跨域限制 (CORS)"));
            }
          }
        }, 3000);
      });
    };

    const runTaskWithRetry = async (submitFn, pollFn, maxRetries = 10, onRetry) => {
      let attempt = 0;
      while (attempt < maxRetries) {
        try {
          const taskId = await submitFn();
          const url = await pollFn(taskId);
          return { url, taskId };
        } catch (e) {
          attempt++;
          console.warn(`Task failed, retrying (${attempt}/${maxRetries}):`, e);
          if (onRetry) onRetry(attempt, e.message);

          if (attempt >= maxRetries) throw e;
          await new Promise(r => setTimeout(r, 2000));
        }
      }
    };

    const blobToBase64 = (blob) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    };

    const dataURLtoFile = (dataurl, filename) => {
      let arr = dataurl.split(','), mime = arr[0].match(/:(.*?);/)[1],
        bstr = atob(arr[1]), n = bstr.length, u8arr = new Uint8Array(n);
      while (n--) {
        u8arr[n] = bstr.charCodeAt(n);
      }
      return new File([u8arr], filename, { type: mime });
    }

    // ================= UI Components =================

    const Toast = ({ message, type, show, onClose }) => {
      useEffect(() => { if (show) { const timer = setTimeout(onClose, 2500); return () => clearTimeout(timer); } }, [show, onClose]);
      if (!show) return null;
      const bgColor = type === 'error' ? 'bg-red-500' : (type === 'success' ? 'bg-green-500' : 'bg-black');
      return (
        <div className={`fixed top-[max(1rem,var(--sat))] mt-2 left-1/2 transform -translate-x-1/2 ${bgColor} text-white px-6 py-2 rounded-full shadow-[2px_2px_0px_0px_rgba(0,0,0,0.2)] z-[200] animate-bounce-in font-bold flex items-center gap-2 border-2 border-white max-w-[90vw] text-center text-xs break-all`}>
          {type === 'success' && <div className="w-2 h-2 bg-white rounded-full flex-shrink-0"></div>} {message}
        </div>
      );
    };

    const InputModal = ({ isOpen, title, defaultValue, onConfirm, onCancel }) => {
      const [value, setValue] = useState(defaultValue || '');
      useEffect(() => { if (isOpen) setValue(defaultValue || ''); }, [isOpen, defaultValue]);

      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4">
          <div className="cartoon-box bg-white w-full max-w-sm p-4 space-y-4 animate-bounce-in">
            <h3 className="text-lg font-black text-center">{title}</h3>
            <input
              type="text"
              className="cartoon-input w-full"
              value={value}
              onChange={(e) => setValue(e.target.value)}
              placeholder="请输入..."
              autoFocus
            />
            <div className="flex gap-2">
              <button onClick={onCancel} className="cartoon-btn secondary flex-1 py-2">取消</button>
              <button onClick={() => onConfirm(value)} className="cartoon-btn flex-1 py-2">确认</button>
            </div>
          </div>
        </div>
      );
    };

    // Params Modal
    const ParamsModal = ({ isOpen, onClose, task }) => {
      if (!isOpen || !task) return null;

      const params = {
        prompt: task.prompt,
        model: task.settings?.model || "nano-banana-pro",
        aspect_ratio: task.settings?.ratio || "N/A",
        image_size: task.settings?.size || "N/A",
        reference_images: task.extraData?.refs || []
      };

      return (
        <div className="fixed inset-0 bg-black/50 z-[90] flex items-center justify-center p-4" onClick={onClose}>
          <div className="cartoon-box bg-white w-full max-w-sm p-4 space-y-3 animate-bounce-in flex flex-col max-h-[80vh]" onClick={e => e.stopPropagation()}>
            <div className="flex justify-between items-center border-b-2 border-black pb-2">
              <h3 className="text-lg font-black">任务参数详情</h3>
              <button onClick={onClose}><X size={20} /></button>
            </div>
            <div className="flex-1 overflow-y-auto no-scrollbar">
              <div className="space-y-2">
                <div>
                  <div className="text-xs font-bold text-gray-500">提示词</div>
                  <div className="text-xs bg-gray-100 p-2 rounded border border-gray-200">{params.prompt}</div>
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <div className="text-xs font-bold text-gray-500">比例</div>
                    <div className="text-xs font-mono">{params.aspect_ratio}</div>
                  </div>
                  <div>
                    <div className="text-xs font-bold text-gray-500">尺寸</div>
                    <div className="text-xs font-mono">{params.image_size}</div>
                  </div>
                </div>
                <div>
                  <div className="text-xs font-bold text-gray-500">参考图 ({params.reference_images.length})</div>
                  {params.reference_images.length > 0 ? (
                    <div className="flex gap-1 overflow-x-auto py-1">
                      {params.reference_images.map((url, i) => (
                        <a key={i} href={url} target="_blank" className="block w-10 h-10 border border-black rounded overflow-hidden flex-shrink-0">
                          <img src={url} className="w-full h-full object-cover" />
                        </a>
                      ))}
                    </div>
                  ) : <div className="text-xs text-gray-400">无</div>}
                </div>
                <div>
                  <div className="text-xs font-bold text-gray-500">完整 JSON</div>
                  <pre className="params-pre">{JSON.stringify(params, null, 2)}</pre>
                </div>
              </div>
            </div>
            <button onClick={onClose} className="cartoon-btn w-full py-2 text-sm">关闭</button>
          </div>
        </div>
      );
    };

    const PromptManager = ({ currentPrompt, setPrompt, showToast, storageKey = 'kpainter_prompts' }) => {
      const [savedPrompts, setSavedPrompts] = useState([]);
      const [showListModal, setShowListModal] = useState(false);
      const [inputModal, setInputModal] = useState({ show: false, title: '', defaultValue: '', onConfirm: null });

      useEffect(() => {
        const loaded = localStorage.getItem(storageKey);
        if (loaded) {
          let parsed = JSON.parse(loaded);
          if (parsed.length > 0 && typeof parsed[0] === 'string') {
            parsed = parsed.map((p, i) => ({ id: Date.now() + i, name: `提示词 ${i + 1}`, content: p }));
            localStorage.setItem(storageKey, JSON.stringify(parsed));
          }
          setSavedPrompts(parsed);
        } else {
          setSavedPrompts([]);
        }
      }, [storageKey]);

      const openSaveModal = () => {
        if (!currentPrompt.trim()) return showToast("提示词为空", "error");
        setInputModal({
          show: true,
          title: "保存提示词",
          defaultValue: `提示词 ${savedPrompts.length + 1}`,
          onConfirm: (name) => {
            if (!name) return;
            const newPrompt = { id: Date.now(), name, content: currentPrompt };
            const newPrompts = [newPrompt, ...savedPrompts].slice(0, 15);
            setSavedPrompts(newPrompts);
            localStorage.setItem(storageKey, JSON.stringify(newPrompts));
            showToast("提示词已保存");
            setInputModal(prev => ({ ...prev, show: false }));
          }
        });
      };

      const selectPrompt = (p) => {
        setPrompt(p.content);
        setShowListModal(false);
        showToast(`已加载：${p.name}`);
      };

      const deletePrompt = (id) => {
        const newPrompts = savedPrompts.filter(p => p.id !== id);
        setSavedPrompts(newPrompts);
        localStorage.setItem(storageKey, JSON.stringify(newPrompts));
      };

      const openRenameModal = (id, oldName) => {
        setInputModal({
          show: true,
          title: "重命名提示词",
          defaultValue: oldName,
          onConfirm: (newName) => {
            if (!newName) return;
            const newPrompts = savedPrompts.map(p => p.id === id ? { ...p, name: newName } : p);
            setSavedPrompts(newPrompts);
            localStorage.setItem(storageKey, JSON.stringify(newPrompts));
            setInputModal(prev => ({ ...prev, show: false }));
          }
        });
      };

      return (
        <div className="flex gap-2 my-3">
          <button onClick={openSaveModal} className="cartoon-btn secondary flex-1 py-2 text-xs flex items-center justify-center gap-2 bg-yellow-200"><Save size={16} /> 保存当前提示词</button>
          <button onClick={() => setShowListModal(true)} className="cartoon-btn flex-1 py-2 text-xs flex items-center justify-center gap-2 bg-white"><List size={16} /> 我的提示词本 ({savedPrompts.length})</button>

          {showListModal && (
            <div className="fixed inset-0 bg-black/50 z-[60] flex items-center justify-center p-4">
              <div className="cartoon-box bg-white w-full max-w-sm p-4 flex flex-col max-h-[70vh] animate-bounce-in">
                <div className="flex justify-between items-center mb-2 flex-shrink-0"><h3 className="font-black text-lg">我的提示词本</h3><button onClick={() => setShowListModal(false)}><X size={20} /></button></div>
                <div className="flex-1 overflow-y-auto space-y-2 pr-1 no-scrollbar">
                  {savedPrompts.length === 0 ? <div className="text-center text-gray-400 text-xs py-4">还没有收藏的提示词哦</div> :
                    savedPrompts.map((p) => (
                      <div key={p.id} className="flex gap-2 items-start border-2 border-gray-100 rounded-lg p-2 hover:bg-yellow-50 transition-colors">
                        <div onClick={() => selectPrompt(p)} className="flex-1 cursor-pointer">
                          <div className="font-bold text-xs mb-1">{p.name}</div>
                          <div className="text-[10px] text-gray-500 line-clamp-2">{p.content}</div>
                        </div>
                        <div className="flex flex-col gap-1">
                          <button onClick={() => openRenameModal(p.id, p.name)} className="text-blue-500 p-1 hover:bg-blue-100 rounded"><Edit size={14} /></button>
                          <button onClick={() => deletePrompt(p.id)} className="text-red-500 p-1 hover:bg-red-100 rounded"><Trash2 size={14} /></button>
                        </div>
                      </div>
                    ))}
                </div>
              </div>
            </div>
          )}

          <InputModal
            isOpen={inputModal.show}
            title={inputModal.title}
            defaultValue={inputModal.defaultValue}
            onConfirm={inputModal.onConfirm}
            onCancel={() => setInputModal(prev => ({ ...prev, show: false }))}
          />
        </div>
      );
    };

    const SettingsPanel = ({ settings, setSettings, customRatio }) => {
      const ratios = ["1:1", "16:9", "9:16", "4:3", "3:4", "3:2", "2:3"];
      const displayRatios = customRatio ? [...ratios, "PIC"] : ratios;
      return (
        <div className="space-y-4 mb-4 flex-shrink-0">
          <div className="flex gap-2">
            {['2K', '4K'].map(res => (
              <button key={res} onClick={() => setSettings({ ...settings, size: res })} className={`option-btn flex-1 py-2 font-bold border-2 border-black rounded-lg ${settings.size === res ? 'bg-blue-300' : 'bg-white'}`}>{res}</button>
            ))}
          </div>
          <div className="grid grid-cols-4 gap-2">
            {displayRatios.map(r => (
              <button key={r} onClick={() => setSettings({ ...settings, ratio: r })} className={`option-btn py-1 text-sm font-bold border-2 border-black rounded-lg ${settings.ratio === r ? 'bg-pink-300' : 'bg-white'}`}>{r}</button>
            ))}
          </div>
        </div>
      );
    };

    const Header = ({ onSettings }) => (
      <div className="flex-none flex items-center justify-between p-4 bg-white border-b-4 border-black z-20 relative">
        <div className="flex items-center gap-2"><div className="w-10 h-10 bg-yellow-400 rounded-lg border-2 border-black flex items-center justify-center"><Wand2 size={24} color="black" /></div><h1 className="text-2xl font-black tracking-tighter">K-painter PRO</h1></div>
        <div className="flex gap-2"><button onClick={onSettings} className="p-2 hover:bg-gray-100 rounded-full border-2 border-transparent hover:border-black transition-all"><Settings size={20} /></button><div className="px-2 py-1 bg-green-400 border-2 border-black rounded-full text-xs font-bold flex items-center">ONLINE</div></div>
      </div>
    );
    const SettingsModal = ({ isOpen, onClose, config, setConfig }) => {
      const [tempConfig, setTempConfig] = useState(config);
      useEffect(() => { if (isOpen) setTempConfig(config); }, [isOpen, config]);
      const handleChange = (key, value) => { setTempConfig(prev => ({ ...prev, [key]: value })); };
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 bg-black/50 z-[60] flex items-center justify-center p-4">
          <div className="cartoon-box bg-white w-full max-w-sm p-4 space-y-3 animate-bounce-in flex flex-col max-h-[80vh]">
            <div className="flex justify-between items-center mb-2 flex-shrink-0"><h3 className="text-lg font-black">全局设置</h3><button onClick={onClose}><X size={20} /></button></div>
            <div className="space-y-3 overflow-y-auto flex-1 pr-2 no-scrollbar">

              {/* Model Select */}
              <div className="flex gap-2 mb-2 p-1 bg-gray-100 rounded-lg">
                <button onClick={() => handleChange('activeModel', 'model1')} className={`flex-1 py-1 text-xs font-bold rounded-md transition-all ${tempConfig.activeModel !== 'model2' ? 'bg-white shadow' : 'text-gray-500'}`}>绘图模型 1 (默认)</button>
                <button onClick={() => handleChange('activeModel', 'model2')} className={`flex-1 py-1 text-xs font-bold rounded-md transition-all ${tempConfig.activeModel === 'model2' ? 'bg-white shadow' : 'text-gray-500'}`}>绘图模型 2 (OpenAI)</button>
              </div>

              {tempConfig.activeModel === 'model2' ? (
                <div className="space-y-2 animate-fade-in">
                  <div className="space-y-1"><label className="text-xs font-bold text-gray-500">API Key</label><input type="text" value={tempConfig.drawModel2_apiKey} onChange={(e) => handleChange('drawModel2_apiKey', e.target.value)} className="cartoon-input w-full text-sm py-1" /></div>
                  <div className="space-y-1"><label className="text-xs font-bold text-gray-500">Base URL</label><input type="text" value={tempConfig.drawModel2_submitUrl} onChange={(e) => handleChange('drawModel2_submitUrl', e.target.value)} className="cartoon-input w-full text-sm py-1" /></div>
                  <div className="space-y-1"><label className="text-xs font-bold text-gray-500">2K 模型 ID</label><input type="text" value={tempConfig.drawModel2_model_2k} onChange={(e) => handleChange('drawModel2_model_2k', e.target.value)} className="cartoon-input w-full text-sm py-1" /></div>
                  <div className="space-y-1"><label className="text-xs font-bold text-gray-500">4K 模型 ID</label><input type="text" value={tempConfig.drawModel2_model_4k} onChange={(e) => handleChange('drawModel2_model_4k', e.target.value)} className="cartoon-input w-full text-sm py-1" /></div>
                </div>
              ) : (
                <div className="space-y-2 animate-fade-in">
                  <div className="space-y-1"><label className="text-xs font-bold text-gray-500">API Key</label><input type="text" value={tempConfig.apiKey} onChange={(e) => handleChange('apiKey', e.target.value)} className="cartoon-input w-full text-sm py-1" /></div>
                  <div className="grid grid-cols-2 gap-2"><div className="space-y-1"><label className="text-xs font-bold text-gray-500">提交接口 URL</label><input type="text" value={tempConfig.submitUrl} onChange={(e) => handleChange('submitUrl', e.target.value)} className="cartoon-input w-full text-xs py-1" /></div><div className="space-y-1"><label className="text-xs font-bold text-gray-500">结果接口 URL</label><input type="text" value={tempConfig.resultUrl} onChange={(e) => handleChange('resultUrl', e.target.value)} className="cartoon-input w-full text-xs py-1" /></div></div>
                  <div className="space-y-1"><label className="text-xs font-bold text-gray-500">绘图模型 ID</label><input type="text" value={tempConfig.drawModel} onChange={(e) => handleChange('drawModel', e.target.value)} className="cartoon-input w-full text-xs py-1" /></div>
                  <div className="border-t-2 border-dashed border-gray-300 my-2 pt-2"><h4 className="text-xs font-black mb-2 text-gray-700">七牛云配置 (必填)</h4><div className="grid grid-cols-2 gap-2 mb-2"><input placeholder="Access Key" type="text" value={tempConfig.qiniuAk} onChange={(e) => handleChange('qiniuAk', e.target.value)} className="cartoon-input w-full text-xs py-1" /><input placeholder="Secret Key" type="password" value={tempConfig.qiniuSk} onChange={(e) => handleChange('qiniuSk', e.target.value)} className="cartoon-input w-full text-xs py-1" /></div><div className="grid grid-cols-2 gap-2"><input placeholder="Bucket Name" type="text" value={tempConfig.qiniuBucket} onChange={(e) => handleChange('qiniuBucket', e.target.value)} className="cartoon-input w-full text-xs py-1" /><input placeholder="Domain" type="text" value={tempConfig.qiniuDomain} onChange={(e) => handleChange('qiniuDomain', e.target.value)} className="cartoon-input w-full text-xs py-1" /></div><div className="space-y-1 mt-2"><label className="text-xs font-bold text-gray-500">七牛云上传地址</label><input type="text" value={tempConfig.qiniuUploadUrl} onChange={(e) => handleChange('qiniuUploadUrl', e.target.value)} className="cartoon-input w-full text-xs py-1" /></div></div>
                </div>
              )}

              {/* Common Vision Settings */}
              <div className="border-t-2 border-black my-2 pt-2">
                <h4 className="text-xs font-black mb-2">通用设置</h4>
                <div className="space-y-1"><label className="text-xs font-bold text-gray-500">视觉模型 URL</label><input type="text" value={tempConfig.visionUrl} onChange={(e) => handleChange('visionUrl', e.target.value)} className="cartoon-input w-full text-xs py-1" /></div>
                <div className="space-y-1"><label className="text-xs font-bold text-gray-500">视觉模型 ID</label><input type="text" value={tempConfig.visionModel} onChange={(e) => handleChange('visionModel', e.target.value)} className="cartoon-input w-full text-xs py-1" /></div>
                <div className="space-y-1"><label className="text-xs font-bold text-gray-500">参考图引用前缀</label><input type="text" value={tempConfig.imageTagPrefix} onChange={(e) => handleChange('imageTagPrefix', e.target.value)} className="cartoon-input w-full text-sm py-1" placeholder="例如: image 或 pic" /></div>

                {/* Translation Settings */}
                <div className="mt-2 pt-2 border-t border-dashed border-gray-300">
                  <div className="flex items-center justify-between mb-2">
                    <h4 className="text-xs font-black text-gray-700 flex items-center gap-1"><Languages size={14} /> 提示词自动翻译</h4>
                    <div className="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
                      <input type="checkbox" name="toggle" id="toggle" className="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer border-gray-300" checked={tempConfig.enableTranslate} onChange={(e) => handleChange('enableTranslate', e.target.checked)} />
                      <label htmlFor="toggle" className={`toggle-label block overflow-hidden h-5 rounded-full cursor-pointer border border-gray-300 ${tempConfig.enableTranslate ? 'bg-green-400' : 'bg-gray-300'}`}></label>
                    </div>
                  </div>
                  {tempConfig.enableTranslate && (
                    <div className="space-y-1"><label className="text-xs font-bold text-gray-500">翻译系统提示词 (System Prompt)</label><textarea value={tempConfig.translatePrompt} onChange={(e) => handleChange('translatePrompt', e.target.value)} className="cartoon-input w-full text-xs py-1 h-16" /></div>
                  )}
                </div>
              </div>
            </div>
            <button onClick={() => { setConfig(tempConfig); onClose(); }} className="cartoon-btn w-full py-3 mt-2 flex-shrink-0">保存配置</button>
          </div>
        </div>
      )
    }
    const TabBar = ({ activeTab, setTab }) => {
      const tabs = [{ id: 'txt2img', icon: Wand2, label: '文生图' }, { id: 'img2img', icon: ImageIcon, label: '图生图' }, { id: 'supertask', icon: Zap, label: '超级任务' }, { id: 'inpaint', icon: Layers, label: '重绘' }, { id: 'history', icon: History, label: '历史' },];
      return (
        <div className="absolute bottom-0 left-0 right-0 bg-white border-t-4 border-black p-2 pb-[calc(0.5rem+env(safe-area-inset-bottom))] flex justify-around items-end z-50">
          {tabs.map(tab => {
            const isActive = activeTab === tab.id;
            return (
              <button key={tab.id} onClick={() => setTab(tab.id)} className={`flex flex-col items-center gap-1 transition-all justify-center py-2 px-1 rounded-lg ${isActive ? 'bg-gray-100' : ''}`}>
                <div className={`w-10 h-10 rounded-full border-2 border-black flex items-center justify-center ${isActive ? (tab.id === 'supertask' ? 'bg-red-500 shadow-[2px_2px_0px_0px_#000]' : 'bg-yellow-400 shadow-[2px_2px_0px_0px_#000]') : 'bg-gray-100'}`}>
                  <tab.icon size={20} color={isActive && tab.id === 'supertask' ? 'white' : 'black'} fill={tab.id === 'supertask' ? 'currentColor' : 'none'} />
                </div>
                <span className="text-[10px] font-bold">{tab.label}</span>
              </button>
            )
          })}
        </div>
      );
    };

    // --- SuperTaskMode ---
    const SuperTaskMode = ({ addToHistory, updateHistory, config, showToast, state, setState }) => {
      const { globalRefs, subTasks, settings } = state;
      const [isProcessing, setIsProcessing] = useState(false);
      const [showSeqModal, setShowSeqModal] = useState(false);
      const [savedSequences, setSavedSequences] = useState([]);

      // Loop Mode State
      const [loopMode, setLoopMode] = useState(false);
      const [batchImages, setBatchImages] = useState([]);
      const [targetRefId, setTargetRefId] = useState(1);

      // Input Modal States
      const [inputModal, setInputModal] = useState({ show: false, title: '', defaultValue: '', onConfirm: null });

      useEffect(() => {
        const loaded = localStorage.getItem('kpainter_sequences');
        if (loaded) setSavedSequences(JSON.parse(loaded));
      }, []);

      const setGlobalRefs = (newRefs) => setState(prev => ({ ...prev, globalRefs: newRefs }));
      const setSubTasks = (newTasks) => setState(prev => ({ ...prev, subTasks: newTasks }));
      const setSettings = (newSettings) => setState(prev => ({ ...prev, settings: { ...prev.settings, ...newSettings } }));

      // Save/Load Logic
      const openSaveSequenceModal = () => {
        if (subTasks.length === 0) return showToast("当前没有任务序列可保存", "error");
        setInputModal({
          show: true,
          title: "保存任务序列",
          defaultValue: "",
          onConfirm: (name) => {
            if (!name) return;
            saveSequence(name);
            setInputModal(prev => ({ ...prev, show: false }));
          }
        });
      };

      const saveSequence = async (name) => {
        try {
          // Process subtasks to persist images
          const persistedSubTasks = await Promise.all(subTasks.map(async (task) => {
            const persistedLocalRefs = await Promise.all(task.localRefs.map(async (ref) => {
              let base64 = "";
              if (ref.file) {
                base64 = await blobToBase64(ref.file);
              } else if (ref.preview && ref.preview.startsWith('data:')) {
                base64 = ref.preview;
              }
              return { ...ref, preview: base64, file: null };
            }));
            return { ...task, localRefs: persistedLocalRefs };
          }));

          const newSeq = { id: Date.now(), name, subTasks: persistedSubTasks, settings };
          const newSequences = [newSeq, ...savedSequences].slice(0, 10);

          localStorage.setItem('kpainter_sequences', JSON.stringify(newSequences));
          setSavedSequences(newSequences);
          showToast("序列任务保存成功");
        } catch (e) {
          if (e.name === 'QuotaExceededError') {
            showToast("保存失败：图片太大，超过本地存储限制", "error");
          } else {
            showToast("保存失败：" + e.message, "error");
          }
        }
      };

      const loadSequence = (seq) => {
        try {
          // Restore images from base64 to File objects
          const restoredSubTasks = seq.subTasks.map(task => ({
            ...task,
            localRefs: task.localRefs.map(ref => {
              if (ref.preview && ref.preview.startsWith('data:')) {
                const filename = "restored_image.png";
                const file = dataURLtoFile(ref.preview, filename);
                return { ...ref, file };
              }
              return ref;
            })
          }));

          setSubTasks(restoredSubTasks);
          setSettings(seq.settings);
          setShowSeqModal(false);
          showToast(`序列 "${seq.name}" 已加载`);
        } catch (e) {
          console.error("Load sequence failed", e);
          showToast("序列加载失败，数据可能已损坏", "error");
        }
      };

      const deleteSequence = (id) => {
        const newSeqs = savedSequences.filter(s => s.id !== id);
        setSavedSequences(newSeqs);
        localStorage.setItem('kpainter_sequences', JSON.stringify(newSeqs));
      };

      const openRenameSequenceModal = (id, oldName) => {
        setInputModal({
          show: true,
          title: "重命名序列",
          defaultValue: oldName,
          onConfirm: (newName) => {
            if (!newName) return;
            const newSeqs = savedSequences.map(s => s.id === id ? { ...s, name: newName } : s);
            setSavedSequences(newSeqs);
            localStorage.setItem('kpainter_sequences', JSON.stringify(newSeqs));
            setInputModal(prev => ({ ...prev, show: false }));
          }
        });
      };

      // 1. One-click Reset
      const handleResetSuperTask = () => {
        setGlobalRefs([]);
        setSubTasks([{ id: 1, prompt: '', localRefs: [] }]);
        setSettings({ size: '2K' });
        setLoopMode(false);
        setBatchImages([]);
        showToast("超级任务已重置");
      };

      const handleGlobalRefUpload = async (e) => {
        const files = Array.from(e.target.files);
        const newRefs = await Promise.all(files.map(file => {
          return new Promise(resolve => {
            const reader = new FileReader();
            reader.onload = (e) => resolve({ id: globalRefs.length + 1 + files.indexOf(file), preview: e.target.result, file });
            reader.readAsDataURL(file);
          });
        }));
        const maxId = globalRefs.length > 0 ? Math.max(...globalRefs.map(r => r.id)) : 0;
        const labelledRefs = newRefs.map((ref, idx) => ({ ...ref, id: maxId + 1 + idx }));
        setGlobalRefs([...globalRefs, ...labelledRefs]);
      };

      const handleBatchImagesUpload = async (e) => {
        const files = Array.from(e.target.files);
        const newImgs = await Promise.all(files.map(file => {
          return new Promise(resolve => {
            const reader = new FileReader();
            reader.onload = (e) => resolve({ preview: e.target.result, file });
            reader.readAsDataURL(file);
          });
        }));
        setBatchImages([...batchImages, ...newImgs]);
      };

      const removeGlobalRef = (id) => { setGlobalRefs(globalRefs.filter(r => r.id !== id)); };
      const addSubTask = () => { setSubTasks([...subTasks, { id: subTasks.length + 1, prompt: '', localRefs: [] }]); };
      const removeSubTask = (id) => { setSubTasks(subTasks.filter(t => t.id !== id)); };
      const updateSubTaskPrompt = (id, text) => { setSubTasks(subTasks.map(t => t.id === id ? { ...t, prompt: text } : t)); };
      const addTagToPrompt = (id, tag) => { setSubTasks(subTasks.map(t => t.id === id ? { ...t, prompt: t.prompt + tag } : t)); };
      const handleSubTaskRefUpload = async (e, taskId) => {
        const files = Array.from(e.target.files);
        const newRefs = await Promise.all(files.map(file => {
          return new Promise(resolve => {
            const reader = new FileReader();
            reader.onload = (e) => resolve({ preview: e.target.result, file });
            reader.readAsDataURL(file);
          });
        }));
        setSubTasks(subTasks.map(t => t.id === taskId ? { ...t, localRefs: [...t.localRefs, ...newRefs] } : t));
      };

      // 安全获取图片宽高比，防止Hang
      const safeGetAspectRatio = (url) => {
        return new Promise((resolve) => {
          if (!url) { resolve("1:1"); return; }
          const img = new Image();
          let done = false;
          const finish = (w, h) => {
            if (done) return;
            done = true;
            if (w && h) resolve(`${w}:${h}`);
            else resolve("1:1"); // Fallback
          };

          img.onload = () => finish(img.width, img.height);
          img.onerror = () => {
            console.warn(`Failed to load image for aspect ratio: ${url}`);
            finish(null, null);
          };

          img.src = url;

          // 3s Timeout safety
          setTimeout(() => {
            if (!done) {
              console.warn(`Timeout loading image for aspect ratio: ${url}`);
              finish(null, null);
            }
          }, 3000);
        });
      };

      const executeSuperTask = async () => {
        const missingTags = [];
        subTasks.forEach(task => {
          const matches = task.prompt.match(/\[pic(\d+)\]/g);
          if (matches) {
            matches.forEach(tag => {
              const id = parseInt(tag.match(/\d+/)[0]);
              if (!globalRefs.find(r => r.id === id)) {
                missingTags.push(`子任务 #${task.id} 引用了无效标签 [pic${id}]`);
              }
            });
          }
        });

        if (missingTags.length > 0) return alert(`提交失败，存在无效引用：\n${missingTags.join('\n')}`);
        if (subTasks.length === 0) return showToast("请添加至少一个子任务");

        // Loop Mode Validation
        if (loopMode) {
          if (batchImages.length === 0) return showToast("循环模式下必须上传循环图 (图片A)", "error");
          if (!globalRefs.find(r => r.id === targetRefId)) return showToast(`未找到目标全局参考图 pic${targetRefId}`, "error");
        }

        setIsProcessing(true);

        const runSequence = async (currentGlobalRefUrls, currentGlobalRefPreviews, sequenceIndex = 0) => {
          const taskStatusMap = {};
          const historyIds = [];

          // Initialize history items for THIS sequence
          subTasks.forEach(task => {
            const histId = Date.now() + task.id + (sequenceIndex * 1000); // Unique IDs per sequence loop
            taskStatusMap[task.id] = { status: 'pending', resultUrl: null, historyId: histId };
            let loopLabel = loopMode ? `[循环${sequenceIndex + 1}] ` : "";
            // Initial Add. IMPORTANT: Store settings here!
            addToHistory({
              id: histId,
              type: 'img2img',
              url: '',
              prompt: `${loopLabel}[子任务 ${task.id}] 等待依赖...`,
              date: new Date(),
              status: 'analyzing',
              progress: 0,
              isMock: false,
              extraData: { refs: [] },
              settings: settings // PERSIST SETTINGS (Default)
            });
            historyIds.push(histId);
          });

          const checkAndRun = async () => {
            let allFinished = true;
            for (const task of subTasks) {
              const statusObj = taskStatusMap[task.id];
              if (statusObj.status === 'success' || statusObj.status === 'failed') continue;
              allFinished = false;

              if (statusObj.status === 'pending') {
                // Check dependencies
                const dependencies = task.prompt.match(/\[result(\d+)\]/g);
                let canRun = true;
                if (dependencies) {
                  for (const dep of dependencies) {
                    const depId = parseInt(dep.match(/\d+/)[0]);
                    if (!taskStatusMap[depId] || !taskStatusMap[depId].resultUrl) {
                      canRun = false;
                      break;
                    }
                  }
                }

                if (canRun) {
                  statusObj.status = 'running';
                  let loopLabel = loopMode ? `[循环${sequenceIndex + 1}] ` : "";
                  updateHistory(statusObj.historyId, { prompt: `${loopLabel}[子任务 ${task.id}] 正在生成...`, status: 'generating' });
                  runSubTask(task, statusObj).then(() => { checkAndRun(); });
                }
              }
            }
            // Sequence finished
            if (allFinished && !loopMode) {
              showToast("超级任务全部完成！");
            }
          };

          const runSubTask = async (task, statusObj) => {
            try {
              const urls = [];
              const previewUrls = []; // Separate array to store local previews for better aspect ratio calculation
              let finalPrompt = task.prompt;
              const tagToIndexMap = {};
              let firstRefRatio = null;

              // Retrieve Configured Tag Prefix
              const tagPrefix = config.imageTagPrefix || "image";

              const addUrlAndPreview = (url, preview) => {
                urls.push(url);
                previewUrls.push(preview || url);
                return urls.length;
              };

              // 2. Robust Logic: Extract tags, resolve URLs, push to ordered array, map to prompt
              const tagRegex = /\[(pic|result)(\d+)\]/g;
              const tagsInPrompt = [];
              let match;
              while ((match = tagRegex.exec(task.prompt)) !== null) {
                if (!tagsInPrompt.includes(match[0])) {
                  tagsInPrompt.push(match[0]);
                }
              }

              // Process tags
              for (const tag of tagsInPrompt) {
                if (!tagToIndexMap[tag]) {
                  const type = tag.startsWith('[pic') ? 'pic' : 'result';
                  const id = parseInt(tag.match(/\d+/)[0]);

                  let url = null;
                  let previewUrl = null;

                  if (type === 'pic') {
                    url = currentGlobalRefUrls[`pic${id}`];
                    previewUrl = currentGlobalRefPreviews[`pic${id}`];
                  } else if (type === 'result') {
                    url = taskStatusMap[id]?.resultUrl;
                    previewUrl = url;
                  }

                  if (url) {
                    const isFirst = urls.length === 0;
                    const idx = addUrlAndPreview(url, previewUrl);
                    tagToIndexMap[tag] = idx; // [pic1] -> 1 (means 图1)

                    // 修复：如果第一张参考图是 result，直接继承上游任务的宽高比，防止加载失败导致丢失比例
                    if (isFirst && type === 'result' && taskStatusMap[id]?.generatedRatio) {
                      firstRefRatio = taskStatusMap[id].generatedRatio;
                    }
                  }
                }
              }

              // Replace tags in prompt with "[prefixN]" e.g. [image1]
              finalPrompt = finalPrompt.replace(tagRegex, (m) => {
                const idx = tagToIndexMap[m];
                return idx ? `[${tagPrefix}${idx}]` : m;
              });

              // Append local refs (if any) - mapped to next available indices
              // Strict sequential upload for subtask local refs
              for (const localRef of task.localRefs) {
                const url = await uploadImageToQiniu(localRef.file, config);
                addUrlAndPreview(url, localRef.preview);
              }

              // 3. FIX: Safe aspect ratio calculation & Reversal Logic
              let aspectRatio = "1:1";

              // User Requirement: "Generate AR consistent with the last reference image" (in the submitted sequence).
              // The submitted sequence will be reversed.
              // Original: [pic1 (base), pic2, pic3]
              // Reversed: [pic3, pic2, pic1 (base)]
              // Last image in reversed is pic1 (base).
              // pic1 is at index 0 of original 'previewUrls'.

              if (firstRefRatio) {
                // 优先使用继承的比例 (针对 [resultN] 场景，避免网络加载失败导致丢失比例)
                aspectRatio = firstRefRatio;
              } else if (previewUrls.length > 0) {
                aspectRatio = await safeGetAspectRatio(previewUrls[0]);
              }

              // Save calculated ratio for downstream tasks
              statusObj.generatedRatio = aspectRatio;

              // Prompt Remapping: Invert indices because we reverse the array
              // Now regex depends on configured prefix
              const totalRefs = urls.length;
              const dynamicRegex = new RegExp("\\[" + tagPrefix + "(\\d+)\\]", "g"); // FIXED: String concatenation for safer parsing

              if (totalRefs > 0) {
                finalPrompt = finalPrompt.replace(dynamicRegex, (match, num) => {
                  const n = parseInt(num);
                  if (n > 0 && n <= totalRefs) {
                    const newN = totalRefs - n + 1;
                    return `[${tagPrefix}${newN}]`;
                  }
                  return match;
                });
              }

              // Translate Prompt if enabled
              finalPrompt = await translateText(finalPrompt, config);

              // REVERSE URLs order for submission as requested (MOVED UP)
              const finalUrlsForSubmission = [...urls].reverse();

              // IMPORTANT FIX: Update history with resolved URLs and prompt BEFORE submission
              // We save the REVERSED urls to history so that Rerun/Copy/View Params show the correct order that matches the reversed prompt
              // Also save the calculated ratio to settings so Rerun/Copy works correctly
              const currentTaskSettings = {
                ...settings,
                ratio: aspectRatio,
                model: getEffectiveModel(config, settings.size)
              };
              updateHistory(statusObj.historyId, {
                prompt: finalPrompt,
                extraData: { refs: finalUrlsForSubmission }, // Save REVERSED urls
                settings: currentTaskSettings
              });

              const { url, taskId } = await runTaskWithRetry(
                () => submitDrawTask(finalPrompt, aspectRatio, settings.size, finalUrlsForSubmission, config),
                (id) => pollTaskResult(id, (p) => updateHistory(statusObj.historyId, { progress: p }), config),
                10,
                (attempt) => showToast(`自动重试 ${attempt}/10`, "info")
              );

              const isMock = taskId.toString().startsWith("mock-");
              statusObj.resultUrl = url;
              statusObj.status = 'success';
              updateHistory(statusObj.historyId, { url, status: 'success', isMock, prompt: finalPrompt });

            } catch (e) {
              console.error(e);
              statusObj.status = 'failed';
              updateHistory(statusObj.historyId, { status: 'failed', prompt: `失败: ${e.message}` });
            }
          };

          await checkAndRun(); // Start the sequence
        };

        (async () => {
          try {
            const globalRefUrls = {};
            const globalRefPreviews = {};

            // 1. Force upload all global refs first (Base set)
            // STRICT SEQUENTIAL UPLOAD
            for (const ref of globalRefs) {
              const url = await uploadImageToQiniu(ref.file, config);
              if (url.startsWith('blob:')) alert(`警告: pic${ref.id} 上传失败，使用Blob URL。`);
              globalRefUrls[`pic${ref.id}`] = url;
              globalRefPreviews[`pic${ref.id}`] = ref.preview;
            }

            // RELEASE BUTTON HERE: After uploads and setup are done, release the button.
            setIsProcessing(false);
            showToast("超级任务后台运行中...");

            if (loopMode) {
              // STRICT SEQUENTIAL LOOP EXECUTION
              for (let i = 0; i < batchImages.length; i++) {
                // Upload current batch image
                const batchImgUrl = await uploadImageToQiniu(batchImages[i].file, config);

                // Create modified context
                const modifiedUrls = { ...globalRefUrls, [`pic${targetRefId}`]: batchImgUrl };
                const modifiedPreviews = { ...globalRefPreviews, [`pic${targetRefId}`]: batchImages[i].preview };

                // Run sequence detached (or await if sequential execution is desired)
                // We await here to prevent overwhelming the server
                await runSequence(modifiedUrls, modifiedPreviews, i);
              }
              showToast("循环任务全部完成");
            } else {
              await runSequence(globalRefUrls, globalRefPreviews);
            }

          } catch (e) {
            console.error(e);
            setIsProcessing(false);
            showToast("任务启动失败: " + e.message, "error");
          }
        })();
      };

      return (
        <div className="absolute inset-0 px-3 pt-2 pb-[calc(90px+0.5rem)] flex flex-col animate-fade-in">
          <div className="cartoon-box flex-1 flex flex-col p-4 bg-yellow-50 overflow-hidden relative">
            <div className="flex justify-between items-center mb-2 flex-shrink-0">

                <div className="grid grid-cols-5 gap-2">
                  {globalRefs.map(ref => (
                    <div key={ref.id} className="relative aspect-square border border-black rounded overflow-hidden group">

                      <div className="absolute bottom-0 right-0 bg-black text-white text-[9px] px-1">pic{ref.id}</div>
