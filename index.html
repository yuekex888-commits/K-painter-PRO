    // --- Txt2Img ---
    const Txt2Img = ({ addToHistory, updateHistory, config, showToast, editingTask, onTaskLoaded, draft, updateDraft }) => {
      const prompt = draft?.prompt || "";
      const settings = draft?.settings || { size: "2K", ratio: "1:1" };
      const [isSubmitting, setIsSubmitting] = useState(false);

      useEffect(() => {
        if (editingTask && editingTask.type === 'txt2img') {
          updateDraft({ prompt: editingTask.prompt, settings: editingTask.settings || { size: "2K", ratio: "1:1" } });
          onTaskLoaded();
        }
      }, [editingTask, onTaskLoaded, updateDraft]);

      const handleReset = () => { updateDraft({ prompt: "", settings: { size: "2K", ratio: "1:1" } }); };

      const setPrompt = (val) => updateDraft({ prompt: val });
      const setSettings = (val) => updateDraft({ settings: val });
      const handleGenerate = async () => {
        if (!prompt) return showToast("请输入提示词！", "error");
        setIsSubmitting(true);
        const tempId = Date.now();
        // Store empty refs for consistency
        const historySettings = { ...settings, model: getEffectiveModel(config, settings.size) };
        addToHistory({ id: tempId, type: 'txt2img', url: '', prompt, date: new Date(), status: 'generating', progress: 0, settings: historySettings, extraData: { refs: [] } });

        try {
          const finalPrompt = await translateText(prompt, config); // Translation Hook
          if (finalPrompt !== prompt) updateHistory(tempId, { prompt: finalPrompt });

          const { url, taskId } = await runTaskWithRetry(
            () => submitDrawTask(finalPrompt, settings.ratio, settings.size, [], config),
            (id) => pollTaskResult(id, (p) => updateHistory(tempId, { progress: p }), config),
            10,
            (attempt) => showToast(`自动重试 ${attempt}/10`, "info")
          );

          const isMock = taskId.toString().startsWith("mock-");
          setIsSubmitting(false);
          updateDraft({ prompt: "" });
          showToast(isMock ? "提交成功 (演示模式)" : "任务已提交后台");

          updateHistory(tempId, { url, status: 'success', isMock, prompt: finalPrompt });
        } catch (e) {
          setIsSubmitting(false);
          showToast(e.message, "error");
          updateHistory(tempId, { status: 'failed', prompt: `失败: ${e.message}` });
        }
      };
      return (<div className="absolute inset-0 px-3 pt-2 pb-[calc(90px+0.5rem)] flex flex-col animate-fade-in"><div className="cartoon-box flex-1 flex flex-col p-4 bg-yellow-100 overflow-hidden relative"><div className="flex justify-between items-center mb-2 flex-shrink-0"><h2 className="text-xl font-black">创意工坊 (文生图)</h2><button onClick={handleReset} className="p-2 bg-white border-2 border-black rounded-full active:scale-95 transition-transform" title="重置"><RotateCcw size={16} /></button></div><div className="flex-1 overflow-y-auto min-h-0 flex flex-col"><textarea className="cartoon-input w-full flex-1 resize-none mb-2 min-h-[120px]" placeholder="输入提示词..." value={prompt} onChange={e => setPrompt(e.target.value)} /><PromptManager currentPrompt={prompt} setPrompt={setPrompt} showToast={showToast} storageKey="kpainter_prompts_txt2img" /><SettingsPanel settings={settings} setSettings={setSettings} /></div><button onClick={handleGenerate} disabled={isSubmitting} className={`cartoon-btn w-full py-3 text-lg flex items-center justify-center gap-2 mt-2 flex-shrink-0 ${isSubmitting ? 'opacity-50' : ''}`}><Play size={20} /> {isSubmitting ? '提交中...' : '开始执行'}</button></div></div>);
    };

    // --- Img2Img ---
    const Img2Img = ({ addToHistory, updateHistory, config, showToast, editingTask, onTaskLoaded, transferData, onConsumeTransfer, draft, updateDraft }) => {
      const refs = draft?.refs || [];
      const prompt = draft?.prompt || "";
      const settings = draft?.settings || { size: "2K", ratio: "1:1" };
      const customPicRatio = draft?.customPicRatio || null;
      const [isSubmitting, setIsSubmitting] = useState(false);

      const setRefs = (val) => updateDraft({ refs: typeof val === 'function' ? val(refs) : val });
      const setPrompt = (val) => updateDraft({ prompt: val });
      // Special handler for setSettings since it often uses functional updates in original code
      const setSettings = (val) => updateDraft({ settings: typeof val === 'function' ? val(settings) : val });
      const setCustomPicRatio = (val) => updateDraft({ customPicRatio: val });

      useEffect(() => {
        if (transferData && transferData.target === 'img2img') {
          const newRef = { preview: transferData.payload, file: null, url: transferData.payload };
          // We need to access current refs, but since 'refs' is from props, we can use it directly?
          // To be safe and follow the pattern, we read potentially stale props but here it's an effect.
          // Better logic:
          if (refs.length === 0) {
            const img = new Image();
            img.onload = () => {
              const exactRatio = `${img.width}:${img.height}`;
              setCustomPicRatio(exactRatio);
              updateDraft({
                refs: [...refs, newRef],
                customPicRatio: exactRatio,
                settings: { ...settings, ratio: "PIC" }
              });
              showToast(`已添加参考图，模式：PIC`);
            };
            img.src = transferData.payload;
          } else {
            setRefs([...refs, newRef]);
          }
          onConsumeTransfer();
        }
      }, [transferData, refs, settings, onConsumeTransfer, updateDraft]); // Added deps


      useEffect(() => {
        if (editingTask && editingTask.type === 'img2img') {
          setPrompt(editingTask.prompt);
          if (editingTask.extraData && editingTask.extraData.refs) {
            const restoredRefs = editingTask.extraData.refs.map(url => ({ preview: url, file: null, url }));
            setRefs(restoredRefs);
            if (editingTask.settings && editingTask.settings.ratio === "PIC" && restoredRefs.length > 0) {
              const img = new Image();
              img.onload = () => {
                setCustomPicRatio(`${img.width}:${img.height}`);
                setSettings({ ...editingTask.settings, ratio: "PIC" });
              };
              img.src = restoredRefs[0].url;
            } else if (editingTask.settings) {
              setSettings(editingTask.settings);
            }
          }
          onTaskLoaded();
        }
      }, [editingTask, onTaskLoaded]);

      const handleFileChange = async (e) => {
        const files = Array.from(e.target.files);
        const newRefs = await Promise.all(files.map(file => {
          return new Promise(resolve => {
            const reader = new FileReader();
            reader.onload = (e) => {
              const img = new Image();
              img.onload = () => resolve({ file, preview: e.target.result, width: img.width, height: img.height });
              img.src = e.target.result;
            };
            reader.readAsDataURL(file);
          });
        }));
        if (newRefs.length > 0 && refs.length === 0) {
          const first = newRefs[0];
          const exactRatio = `${first.width}:${first.height}`;
          setCustomPicRatio(exactRatio);
          setSettings(s => ({ ...s, ratio: "PIC" }));
          showToast(`已应用第一张图比例 (PIC)`);
        }
        setRefs([...refs, ...newRefs]);
      };

      const removeRef = (index) => {
        setRefs(prev => {
          const next = prev.filter((_, i) => i !== index);
          if (next.length === 0) { setCustomPicRatio(null); setSettings(s => ({ ...s, ratio: "1:1" })); }
          return next;
        });
      };
      const handleReset = () => { updateDraft({ prompt: "", refs: [], customPicRatio: null, settings: { size: "2K", ratio: "1:1" } }); };

      const handleGenerate = async () => {
        if (refs.length === 0) return showToast("请上传参考图", "error");
        setIsSubmitting(true);
        const tempId = Date.now();

        try {
          // STRICT SEQUENTIAL UPLOAD
          const uploadedUrls = [];
          for (const r of refs) {
            const url = r.file ? await uploadImageToQiniu(r.file, config) : (r.url || r.preview);
            uploadedUrls.push(url);
          }

          let finalRatio = settings.ratio;
          if (settings.ratio === "PIC") finalRatio = customPicRatio || "1:1";

          // IMPORTANT FIX: Save the EXPLICIT ratio into history settings so Rerun/Copy works
          const historySettings = {
            ...settings,
            ratio: finalRatio,
            model: getEffectiveModel(config, settings.size)
          };

          addToHistory({ id: tempId, type: 'img2img', url: '', prompt, date: new Date(), status: 'generating', progress: 0, extraData: { refs: uploadedUrls }, settings: historySettings });

          const finalPrompt = await translateText(prompt, config); // Translation Hook
          if (finalPrompt !== prompt) updateHistory(tempId, { prompt: finalPrompt });

          const { url, taskId } = await runTaskWithRetry(
            () => submitDrawTask(finalPrompt, finalRatio, settings.size, uploadedUrls, config),
            (id) => pollTaskResult(id, (p) => updateHistory(tempId, { progress: p }), config),
            10,
            (attempt) => showToast(`自动重试 ${attempt}/10`, "info")
          );

          const isMock = taskId.toString().startsWith("mock-");
          setIsSubmitting(false);
          updateDraft({ prompt: "" });
          showToast(isMock ? "提交成功 (演示模式)" : "任务已提交后台");

          updateHistory(tempId, { url, status: 'success', isMock, prompt: finalPrompt });

        } catch (e) {
          setIsSubmitting(false);
          showToast(e.message, "error");
          updateHistory(tempId, { status: 'failed', prompt: `失败: ${e.message}` });
        }
      };
      return (
        <div className="absolute inset-0 px-3 pt-2 pb-[calc(90px+0.5rem)] flex flex-col animate-fade-in"><div className="cartoon-box flex-1 flex flex-col p-4 bg-blue-100 overflow-hidden relative"><div className="flex justify-between items-center mb-2 flex-shrink-0"><h2 className="text-xl font-black">灵感重塑 (图生图)</h2><button onClick={handleReset} className="p-2 bg-white border-2 border-black rounded-full active:scale-95 transition-transform" title="重置"><RotateCcw size={16} /></button></div><div className="flex-1 overflow-y-auto min-h-0 flex flex-col">
          <div className="flex gap-2 overflow-x-auto pb-2 mb-2 flex-shrink-0">{refs.map((ref, idx) => (<div key={idx} className="relative w-24 h-24 flex-shrink-0 border-2 border-black rounded-lg overflow-hidden bg-white group"><img src={ref.preview} className="w-full h-full object-cover" /><button onClick={() => removeRef(idx)} className="absolute top-1 right-1 bg-red-500 text-white rounded-full p-0.5 border border-black shadow hover:scale-110 active:scale-90 transition-transform"><X size={12} /></button><div className="absolute bottom-0 right-0 bg-black text-white text-[10px] px-1">{idx + 1}</div></div>))}<label className="w-24 h-24 flex-shrink-0 border-2 border-dashed border-black rounded-lg flex flex-col items-center justify-center bg-white cursor-pointer active:bg-gray-200"><Plus size={24} /><span className="text-xs font-bold">添加</span><input type="file" multiple accept="image/*" className="hidden" onChange={handleFileChange} /></label></div>
          <textarea className="cartoon-input w-full flex-1 resize-none mb-2 min-h-[100px]" placeholder="输入补充提示词..." value={prompt} onChange={e => setPrompt(e.target.value)} />
          <PromptManager currentPrompt={prompt} setPrompt={setPrompt} showToast={showToast} storageKey="kpainter_prompts_img2img" />
          <SettingsPanel settings={settings} setSettings={setSettings} customRatio={customPicRatio} /></div><button onClick={handleGenerate} disabled={isSubmitting} className={`cartoon-btn w-full py-3 text-lg flex items-center justify-center gap-2 mt-2 flex-shrink-0 ${isSubmitting ? 'opacity-50' : ''}`}><Play size={20} /> {isSubmitting ? '提交中...' : '开始执行'}</button></div></div>
      );
    };

    // --- InpaintMode ---
    const InpaintMode = ({ addToHistory, updateHistory, historyItems, config, showToast, transferData, onConsumeTransfer, editingTask, onTaskLoaded, draft, updateDraft }) => {
      const baseImage = draft?.baseImage || null;
      const points = draft?.points || [];
      const activePoint = draft?.activePoint || null;
      const settings = draft?.settings || { size: "2K", ratio: "ORIGINAL" };

      const setBaseImage = (val) => updateDraft({ baseImage: typeof val === 'function' ? val(baseImage) : val });
      const setPoints = (val) => updateDraft({ points: typeof val === 'function' ? val(points) : val });
      const setActivePoint = (val) => updateDraft({ activePoint: typeof val === 'function' ? val(activePoint) : val });
      const setSettings = (val) => updateDraft({ settings: typeof val === 'function' ? val(settings) : val });

      // ... (useEffect for restore/transfer same as before) ...
      useEffect(() => {
        if (editingTask && editingTask.type === 'inpaint_step' && editingTask.extraData) {
          const { baseImageUrl, points: savedPoints, baseImageDims } = editingTask.extraData;
          if (baseImageUrl) {
            const img = new Image();
            img.onload = () => {
              setBaseImage({ preview: baseImageUrl, url: baseImageUrl, file: null, width: img.width || 1024, height: img.height || 1024 });
              const restoredPoints = (savedPoints || []).map(p => ({ ...p, refImg: p.refImg }));
              setPoints(restoredPoints);
              showToast("已还原局部重绘任务");
            };
            img.src = baseImageUrl;
          }
          onTaskLoaded();
        }
      }, [editingTask, onTaskLoaded]);

      useEffect(() => {
        if (transferData && transferData.target === 'inpaint') {
          const img = new Image();
          img.onload = () => {
            updateDraft({
              baseImage: { preview: transferData.payload, file: null, width: img.width, height: img.height, url: transferData.payload },
              points: []
            });
            showToast("图片已设为重绘底图");
          };
          img.src = transferData.payload;
          onConsumeTransfer();
        }
      }, [transferData, onConsumeTransfer, updateDraft]);

      const handleBaseUpload = (e) => { const file = e.target.files[0]; if (file) { const reader = new FileReader(); reader.onload = (evt) => { const img = new Image(); img.onload = () => { setBaseImage({ preview: evt.target.result, file, width: img.width, height: img.height }); setPoints([]); }; img.src = evt.target.result; }; reader.readAsDataURL(file); } };
      const handleImageClick = (e) => { if (!baseImage) return; const rect = e.target.getBoundingClientRect(); const x = (e.clientX - rect.left) / rect.width; const y = (e.clientY - rect.top) / rect.height; const newId = points.length + 1; const newPoint = { id: newId, x, y, mode: 'text', refImg: null, desc: '', generatedPrompt: '', isNew: true }; setPoints([...points, newPoint]); setActivePoint(newPoint); };
      const handlePointClick = (e, p) => { e.stopPropagation(); setActivePoint(p); };
      const handleDeletePoint = () => { setPoints(prev => prev.filter(p => p.id !== activePoint.id)); setActivePoint(null); };
      const confirmPointConfig = () => { setPoints(prev => prev.map(p => p.id === activePoint.id ? { ...activePoint, isNew: false } : p)); setActivePoint(null); };
      const handleCancel = () => { if (activePoint && activePoint.isNew) { setPoints(prev => prev.filter(p => p.id !== activePoint.id)); } setActivePoint(null); };

      const startBatchProcess = async () => {
        if (points.length === 0) return;

        const processingPoints = JSON.parse(JSON.stringify(points));
        const processingBaseImage = { ...baseImage };
        const processingSettings = { ...settings };

        // Clear local state immediately for UX
        const resetDraft = { baseImage: null, points: [], activePoint: null };
        updateDraft(resetDraft);
        showToast("任务已提交后台处理");

        (async () => {
          try {
            let currentBaseImgUrl = await uploadImageToQiniu(processingBaseImage.file || processingBaseImage.url, config);
            const baseRatio = `${processingBaseImage.width}:${processingBaseImage.height}`;

            // 2. 使用配置的分组数量
            const batchSize = config.inpaintBatchSize || 3;
            const groups = [];
            for (let i = 0; i < processingPoints.length; i += batchSize) {
              groups.push(processingPoints.slice(i, i + batchSize));
            }

            const historyIds = [];
            groups.forEach((group, i) => {
              const tempId = Date.now() + i;
              historyIds.push(tempId);
              // IMPORTANT FIX: Save processingSettings to history
              addToHistory({
                id: tempId,
                type: 'inpaint_step',
                url: '',
                prompt: '正在进行视觉识别...',
                date: new Date(),
                isMock: false,
                status: 'analyzing',
                progress: 0,
                extraData: { baseImageUrl: currentBaseImgUrl, baseImageDims: { width: processingBaseImage.width, height: processingBaseImage.height }, points: [], refs: [] },
                settings: {
                  ...processingSettings,
                  model: getEffectiveModel(config, processingSettings.size)
                } // PERSIST SETTINGS
              });
            });

            historyIds.forEach(id => updateHistory(id, { prompt: "视觉模型正在并行识别中..." }));

            const analyzedPoints = await Promise.all(processingPoints.map(async (point) => {
              let promptX = "";
              let visionAnswer = "";

              if (config.visionPrompt && !point.desc.includes("不识别") && point.mode === 'text') {
                let promptP = config.visionPrompt.replace('[[坐标AAA]]', `(${point.x.toFixed(2)},${point.y.toFixed(2)})`);
                visionAnswer = await callVisionModel(currentBaseImgUrl, promptP, config);
              } else {
                visionAnswer = "指定区域";
              }

              let instruction = "";
              // 3. Prompt Construction for Add/Replace
              if (point.mode === 'add') {
                instruction = "添加参考图PLACEHOLDER";
              } else if (point.mode === 'replace') {
                instruction = "替换为参考图PLACEHOLDER";
              } else {
                instruction = point.desc;
              }

              promptX = config.inpaintPrompt.replace('[[答案A]]', visionAnswer).replace('任务指令X', instruction);

              return { ...point, generatedPrompt: promptX };
            }));

            const analyzedGroups = [];
            for (let i = 0; i < analyzedPoints.length; i += batchSize) {
              analyzedGroups.push(analyzedPoints.slice(i, i + batchSize));
            }

            for (let i = 0; i < analyzedGroups.length; i++) {
              const group = analyzedGroups[i];
              const tempId = historyIds[i];

              // Collect ref images for this group
              const groupRefs = [currentBaseImgUrl];
              let refCounter = 2; // 修复：参考图1是底图，所以新增的参考图从2开始计数

              // *** CRITICAL FIX: STRICT SEQUENTIAL PROCESSING ***
              const finalGroupPoints = [];

              for (const p of group) {
                let finalPrompt = p.generatedPrompt;
                let refUrl = null;

                if ((p.mode === 'add' || p.mode === 'replace') && p.refImg) {
                  refUrl = await uploadImageToQiniu(p.refImg, config);
                  groupRefs.push(refUrl);
                  // Replace PLACEHOLDER with counter sequentially
                  finalPrompt = finalPrompt.replace("PLACEHOLDER", refCounter++);
                }
                finalGroupPoints.push({ ...p, generatedPrompt: finalPrompt, refImg: refUrl });
              }

              // IMPORTANT FIX: Save refs in history so rerun works
              updateHistory(tempId, {
                extraData: {
                  baseImageUrl: currentBaseImgUrl,
                  baseImageDims: { width: processingBaseImage.width, height: processingBaseImage.height },
                  points: finalGroupPoints,
                  refs: groupRefs
                }
              });

              let groupPrompts = finalGroupPoints.map(p => p.generatedPrompt).join("; ");

              // Translation Hook for Batch
              groupPrompts = await translateText(groupPrompts, config);

              updateHistory(tempId, { prompt: groupPrompts, status: 'generating' });

              try {
                const { url, taskId } = await runTaskWithRetry(
                  () => submitDrawTask(groupPrompts, baseRatio, processingSettings.size, groupRefs, config),
                  (id) => pollTaskResult(id, (p) => updateHistory(tempId, { progress: p }), config),
                  10,
                  (attempt) => showToast(`自动重试 ${attempt}/10`, "info")
                );

                const isMock = taskId.toString().startsWith("mock-");
                currentBaseImgUrl = url;
                updateHistory(tempId, { url, status: 'success', isMock, prompt: groupPrompts });

                if (isMock && i === 0) showToast("提示：已自动切换为演示模式");
              } catch (e) {
                showToast(`第 ${i + 1} 组失败: ${e.message}`, "error");
                updateHistory(tempId, { status: 'failed', prompt: e.message });
                break;
              }
            }
            showToast("全流程处理完成！");
          } catch (error) {
            console.error(error);
            showToast("后台处理出错", "error");
          }
        })();
      };

      return (
        <div className="absolute inset-0 px-3 pt-2 pb-[calc(90px+0.5rem)] flex flex-col animate-fade-in"><div className="cartoon-box flex-1 flex flex-col p-4 bg-green-100 overflow-hidden relative"><div className="flex justify-between items-center mb-2 flex-shrink-0"><h2 className="text-xl font-black flex items-center gap-2"><span>精准重绘</span><span className="text-sm bg-black text-white px-2 rounded-full">{points.length}</span></h2><div className="flex gap-2"><div className="flex bg-white rounded-lg border-2 border-black overflow-hidden"><button onClick={() => setSettings({ ...settings, size: '2K' })} className={`px-2 py-1 text-xs font-bold ${settings.size === '2K' ? 'bg-green-300' : ''}`}>2K</button><button onClick={() => setSettings({ ...settings, size: '4K' })} className={`px-2 py-1 text-xs font-bold border-l-2 border-black ${settings.size === '4K' ? 'bg-green-300' : ''}`}>4K</button></div><button onClick={() => { setBaseImage(null); setPoints([]); }} className="p-2 bg-white border-2 border-black rounded-full active:scale-95 transition-transform" title="重置"><RotateCcw size={16} /></button></div></div><div className="flex-1 overflow-y-auto min-h-0 flex flex-col"><div className="relative border-4 border-black bg-white rounded-lg overflow-hidden flex-1 min-h-[200px] flex items-center justify-center bg-gray-200">{!baseImage ? (<label className="flex flex-col items-center p-8 cursor-pointer"><Upload size={48} /><span className="font-bold mt-2">上传底图 / 从历史选择</span><input type="file" className="hidden" onChange={handleBaseUpload} /></label>) : (<><img src={baseImage.preview} className="w-full h-full object-contain pointer-events-auto" onClick={handleImageClick} />{points.map(p => (<div key={p.id} onClick={(e) => handlePointClick(e, p)} className="absolute w-6 h-6 bg-red-500 border-2 border-white rounded-full flex items-center justify-center text-white text-xs font-bold shadow-md transform -translate-x-1/2 -translate-y-1/2 cursor-pointer hover:scale-125 transition-transform" style={{ left: `${p.x * 100}%`, top: `${p.y * 100}%` }}>{p.id}</div>))}</>)}</div><div className="mt-4 flex gap-2 overflow-x-auto flex-shrink-0">{points.map(p => (<div key={p.id} className="min-w-[100px] p-2 bg-white border-2 border-black rounded text-xs"><div className="font-bold">点 #{p.id} ({p.mode})</div><div className="truncate text-gray-500">{p.desc || "无描述"}</div></div>))}</div></div><div className="mt-4 flex gap-2 flex-shrink-0"><button onClick={startBatchProcess} disabled={points.length === 0} className={`cartoon-btn w-full py-3 mt-2 flex-shrink-0 flex items-center justify-center gap-2`}><Play size={20} /> 开始执行</button></div></div>
          {activePoint && (
            <div className="fixed inset-0 bg-black/50 z-[60] flex items-center justify-center p-4">
              <div className="cartoon-box bg-white w-full max-w-sm p-4 space-y-3 animate-bounce-in">
                <h3 className="text-lg font-black">配置任务点 #{activePoint.id}</h3>
                <div className="flex gap-2"><button onClick={() => setActivePoint({ ...activePoint, mode: 'text' })} className={`flex-1 py-2 text-xs border-2 border-black rounded flex flex-col items-center justify-center gap-1 ${activePoint.mode === 'text' ? 'bg-yellow-300' : 'bg-white'}`}><Type size={16} />纯文字</button><button onClick={() => setActivePoint({ ...activePoint, mode: 'add' })} className={`flex-1 py-2 text-xs border-2 border-black rounded flex flex-col items-center justify-center gap-1 ${activePoint.mode === 'add' ? 'bg-yellow-300' : 'bg-white'}`}><ImagePlus size={16} />添加+图</button><button onClick={() => setActivePoint({ ...activePoint, mode: 'replace' })} className={`flex-1 py-2 text-xs border-2 border-black rounded flex flex-col items-center justify-center gap-1 ${activePoint.mode === 'replace' ? 'bg-yellow-300' : 'bg-white'}`}><Replace size={16} />替换+图</button></div>
                <textarea className="cartoon-input w-full h-20" placeholder={activePoint.mode === 'text' ? "输入指令描述..." : "输入指令描述 (可选)..."} value={activePoint.desc} onChange={e => setActivePoint({ ...activePoint, desc: e.target.value })} />
                {activePoint.mode !== 'text' && (<div className="flex items-center gap-2"><label className="flex-1 border-2 border-black border-dashed rounded h-10 flex items-center justify-center bg-gray-50 text-xs font-bold cursor-pointer">{activePoint.refImg ? "已选参考图" : "+ 参考图 (必需)"}<input type="file" className="hidden" onChange={(e) => setActivePoint({ ...activePoint, refImg: e.target.files[0] })} /></label></div>)}
                <button onClick={confirmPointConfig} className="cartoon-btn w-full py-3">确认配置 (暂不识别)</button>
                <div className="flex justify-between items-center mt-2"><button onClick={handleDeletePoint} className="text-xs text-red-500 font-bold underline">删除此节点</button><button onClick={handleCancel} className="text-xs text-center underline">取消</button></div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // ... HistoryView ...
    const HistoryView = ({ history, onRerun, onEdit, onDelete, onSendToImg2Img, onSendToInpaint, onCopy, onBatchDownload, onCopyLink, onBatchRerun, showToast }) => {
      const [selectedImg, setSelectedImg] = useState(null);
      const [actionItem, setActionItem] = useState(null);
      const [showBatchMenu, setShowBatchMenu] = useState(false);
      const [showParamsModal, setShowParamsModal] = useState(false);

      // Batch Selection State
      const [isSelectionMode, setIsSelectionMode] = useState(false);
      const [selectedIds, setSelectedIds] = useState(new Set());
      const timerRef = useRef(null);
      const isLongPressRef = useRef(false);

      const toggleSelection = (id) => {
        const newSet = new Set(selectedIds);
        if (newSet.has(id)) newSet.delete(id);
        else newSet.add(id);
        setSelectedIds(newSet);
      };

      const selectAll = () => {
        if (selectedIds.size === history.length) setSelectedIds(new Set());
        else setSelectedIds(new Set(history.map(item => item.id)));
      };

      const exitSelectionMode = () => {
        setIsSelectionMode(false);
        setSelectedIds(new Set());
        setShowBatchMenu(false);
      };

      const handleBatchOpen = () => {
        if (selectedIds.size === 0) return;
        const urls = [];
        selectedIds.forEach(id => {
          const item = history.find(h => h.id === id);
          if (item && item.url) urls.push(item.url);
        });
        if (urls.length === 0) return showToast("选中的任务没有有效的链接", "error");

        showToast(`正在打开 ${urls.length} 个链接，请允许弹窗...`);
        urls.forEach(url => window.open(url, '_blank'));
        setShowBatchMenu(false);
      };

      const handleBatchCopyUrls = () => {
        if (selectedIds.size === 0) return;
        const urls = [];
        selectedIds.forEach(id => {
          const item = history.find(h => h.id === id);
          if (item && item.url) urls.push(item.url);
        });
        if (urls.length === 0) return showToast("选中的任务没有有效的链接", "error");

        const text = urls.join('\n');
        const textArea = document.createElement("textarea");
        textArea.value = text;
        document.body.appendChild(textArea);
        textArea.select();
        try {
          document.execCommand('copy');
          showToast(`已复制 ${urls.length} 个链接`);
        } catch (err) {
          showToast("复制失败", "error");
        }
        document.body.removeChild(textArea);
        setShowBatchMenu(false);
      };

      const handleBatchDelete = () => {
        if (selectedIds.size === 0) return;
        if (!confirm(`确定删除选中的 ${selectedIds.size} 个任务吗？`)) return;

        selectedIds.forEach(id => onDelete(id));
        setSelectedIds(new Set());
        setShowBatchMenu(false);
        showToast("批量删除完成");
      };

      const handleBatchDownloadSelected = () => {
        const selectedItems = history.filter(h => selectedIds.has(h.id));
        if (selectedItems.length === 0) return showToast("未选中任何任务");
        onBatchDownload(selectedItems);
        setShowBatchMenu(false);
        exitSelectionMode();
      };

      const handleBatchRerunSelected = () => {
        const selectedItems = history.filter(h => selectedIds.has(h.id));
        if (selectedItems.length === 0) return showToast("未选中任何任务");
        onBatchRerun(selectedItems);
        setShowBatchMenu(false);
        exitSelectionMode();
      };

      // Touch/Press Handlers
      const handleTouchStart = (id) => {
        if (!isSelectionMode) {
          isLongPressRef.current = false;
          timerRef.current = setTimeout(() => {
            setIsSelectionMode(true);
            toggleSelection(id);
            isLongPressRef.current = true;
            if (navigator.vibrate) navigator.vibrate(50);
          }, 600);
        }
      };

      const handleTouchEnd = () => {
        if (timerRef.current) {
          clearTimeout(timerRef.current);
          timerRef.current = null;
        }
      };

      const handleCardClick = (e, item) => {
        // If it was a long press, stop here (selection already toggled in timeout)
        if (isLongPressRef.current) {
          isLongPressRef.current = false;
          return;
        }

        if (isSelectionMode) {
          toggleSelection(item.id);
        } else {
          setActionItem(item);
        }
      };

      return (
        <div className="absolute inset-0 px-3 pt-2 pb-[calc(90px+0.5rem)] flex flex-col animate-fade-in">
          <div className="cartoon-box flex-1 flex flex-col p-4 bg-purple-100 overflow-hidden">
            <div className="flex justify-between items-center mb-4 flex-shrink-0">
              <h2 className="text-xl font-black flex items-center gap-2">
                作品集 ({history.length})
              </h2>
              <div className="flex gap-2">
                {/* Removed Cloud Download and CheckSquare buttons */}
              </div>
            </div>

            {isSelectionMode && (
              <div className="flex gap-2 mb-2 justify-between items-center bg-white p-2 rounded-lg border-2 border-black animate-fade-in">
                <span className="text-xs font-bold ml-1">已选: {selectedIds.size}</span>
                <div className="flex gap-2">
                  <button onClick={selectAll} className="text-xs underline font-bold">全选/取消</button>
                  <button onClick={exitSelectionMode} className="text-xs text-red-500 font-bold">退出</button>
                </div>
              </div>
            )}

            <div className="flex-1 overflow-y-auto min-h-0">
              <div className="grid grid-cols-3 gap-2 pb-20">
                {history.map((item, idx) => (
                  <div
                    key={item.id || idx}
                    className={`bg-white border-2 border-black rounded-lg overflow-hidden group relative aspect-[3/4] cursor-pointer active:scale-95 transition-transform noselect ${isSelectionMode && selectedIds.has(item.id) ? 'selected-card' : ''}`}
                    onTouchStart={() => handleTouchStart(item.id)}
                    onTouchEnd={handleTouchEnd}
                    onMouseDown={() => handleTouchStart(item.id)} // Desktop support
                    onMouseUp={handleTouchEnd}
                    onMouseLeave={handleTouchEnd}
                    onClick={(e) => handleCardClick(e, item)}
                    onContextMenu={(e) => e.preventDefault()}
                    onDoubleClick={(e) => {
                      e.stopPropagation();
                      if (!isSelectionMode) setSelectedImg(item.url);
                    }}
                  >
                    {/* Selection Checkbox Overlay */}
                    {isSelectionMode && (
                      <div className={`check-circle ${selectedIds.has(item.id) ? 'checked' : ''}`}>
                        {selectedIds.has(item.id) && <Check size={16} />}
                      </div>
                    )}

                    {item.status === 'generating' || item.status === 'analyzing' ? (
                      <div className="w-full h-full flex flex-col items-center justify-center bg-gray-200">
                        <div className="animate-spin rounded-full h-6 w-6 border-b-2 border-black"></div>
                        <span className="text-[8px] mt-2 font-bold px-1 text-center leading-tight">{item.status === 'analyzing' ? '分析中...' : `生成中 ${item.progress || 0}%`}</span>
                      </div>
                    ) : item.status === 'failed' ? (
                      <div className="w-full h-full flex items-center justify-center bg-red-100"><span className="text-xs font-bold text-red-500">失败</span></div>
                    ) : (
                      <>
                        <img src={item.url} className="w-full h-full object-cover" />
                        <div className="absolute inset-0 bg-black/0 group-hover:bg-black/10 transition-all" />
                      </>
                    )}
                    <div className="absolute bottom-0 left-0 right-0 p-1 text-[8px] font-bold truncate border-t-2 border-black bg-white flex justify-between">
                      <span>{item.type.toUpperCase()}</span>
                      {item.isMock && <span className="text-red-500">DEMO</span>}
                    </div>
                  </div>
                ))}
              </div>
              {history.length === 0 && <div className="text-center text-gray-500 mt-20 font-bold">暂无作品，长按任务可多选</div>}
            </div>

            {/* Floating Batch Action Bar - Z-Index Updated and Bottom Value Changed */}
            {isSelectionMode && selectedIds.size > 0 && (
              <div className="absolute bottom-28 left-4 right-4 animate-bounce-in z-40">
                <button
                  onClick={() => setShowBatchMenu(true)}
                  className="cartoon-btn w-full py-3 flex items-center justify-center gap-2 shadow-lg"
                >
                  <Settings size={20} /> 批量操作 ({selectedIds.size})
                </button>
              </div>
            )}

            {/* Batch Menu Modal */}
            {showBatchMenu && (
              <div className="fixed inset-0 bg-black/50 z-[90] flex items-center justify-center p-4" onClick={() => setShowBatchMenu(false)}>
                <div className="cartoon-box bg-white w-full max-w-xs p-4 space-y-3 animate-bounce-in" onClick={e => e.stopPropagation()}>
                  <h3 className="text-lg font-black border-b-2 border-black pb-2 text-center">批量操作 ({selectedIds.size})</h3>
                  <div className="space-y-2">
                    <button onClick={handleBatchDownloadSelected} className="cartoon-btn w-full py-3 flex items-center justify-center gap-2 bg-yellow-400">
                      <DownloadCloud size={18} /> 批量下载图片
                    </button>
                    <button onClick={handleBatchOpen} className="cartoon-btn w-full py-3 flex items-center justify-center gap-2 bg-white">
                      <ExternalLink size={18} /> 批量打开链接
                    </button>
                    <button onClick={handleBatchCopyUrls} className="cartoon-btn w-full py-3 flex items-center justify-center gap-2 bg-white">
                      <Copy size={18} /> 批量复制链接
                    </button>
                    <button onClick={handleBatchRerunSelected} className="cartoon-btn w-full py-3 flex items-center justify-center gap-2 bg-blue-300">
                      <Repeat size={18} /> 批量重启
                    </button>
                    <button onClick={handleBatchDelete} className="cartoon-btn danger w-full py-3 flex items-center justify-center gap-2">
                      <Trash2 size={18} /> 批量删除
                    </button>
                  </div>
                  <button onClick={() => setShowBatchMenu(false)} className="w-full text-center text-sm underline mt-2">取消</button>
                </div>
              </div>
            )}
          </div>

          {selectedImg && (<div className="fixed inset-0 bg-black/90 z-[100] flex items-center justify-center p-4" onClick={() => setSelectedImg(null)}><img src={selectedImg} className="max-w-full max-h-full object-contain rounded-lg border-4 border-white" /><button className="absolute top-4 right-4 text-white"><X size={32} /></button></div>)}
          {actionItem && (
            <div className="fixed inset-0 bg-black/50 z-[90] flex items-center justify-center p-4" onClick={() => setActionItem(null)}>
              <div className="cartoon-box bg-white w-full max-w-xs p-4 space-y-3 animate-bounce-in" onClick={e => e.stopPropagation()}>
                <h3 className="text-lg font-black border-b-2 border-black pb-2">任务操作</h3>
                <div className="space-y-2">
                  <button onClick={() => { onRerun(actionItem); setActionItem(null); }} className="cartoon-btn w-full py-3 flex items-center justify-center gap-2"><Repeat size={18} /> 立即重做</button>

                  {/* 2. 只有非 'analyzing' 状态才显示复制 */}
                  {actionItem.status !== 'analyzing' && (
                    <button onClick={() => { onCopy(actionItem); setActionItem(null); }} className="cartoon-btn w-full py-3 flex items-center justify-center gap-2 bg-yellow-400"><Copy size={18} /> 复制任务</button>
                  )}
                  {actionItem.status === 'success' && (
                    <button onClick={() => { onCopyLink(actionItem.url); setActionItem(null); }} className="cartoon-btn w-full py-3 flex items-center justify-center gap-2 bg-yellow-400"><ExternalLink size={18} /> 跳转链接</button>
                  )}
                  <button onClick={() => { onEdit(actionItem); setActionItem(null); }} className="cartoon-btn w-full py-3 flex items-center justify-center gap-2 bg-yellow-400"><Edit size={18} /> 编辑任务</button>
                  <button onClick={() => { setShowParamsModal(true); }} className="cartoon-btn w-full py-3 flex items-center justify-center gap-2 bg-blue-200"><Info size={18} /> 查看参数</button>
                  {actionItem.status === 'success' && (<><button onClick={() => { onSendToImg2Img(actionItem.url); setActionItem(null); }} className="cartoon-btn w-full py-3 flex items-center justify-center gap-2 bg-yellow-400"><SendTo size={18} /> 传图生图</button><button onClick={() => { onSendToInpaint(actionItem.url); setActionItem(null); }} className="cartoon-btn w-full py-3 flex items-center justify-center gap-2 bg-yellow-400"><Layers size={18} /> 传重绘</button><button onClick={() => { setSelectedImg(actionItem.url); setActionItem(null); }} className="cartoon-btn w-full py-3 flex items-center justify-center gap-2 bg-yellow-400"><Eye size={18} /> 查看大图</button></>)}<button onClick={() => { onDelete(actionItem.id); setActionItem(null); }} className="cartoon-btn danger w-full py-3 flex items-center justify-center gap-2"><Trash2 size={18} /> 删除任务</button></div><button onClick={() => setActionItem(null)} className="w-full text-center text-sm underline mt-2">取消</button></div></div>)}
          <ParamsModal isOpen={showParamsModal} onClose={() => setShowParamsModal(false)} task={actionItem} />
        </div>
      );
    };

    const App = () => {
      const [activeTab, setTab] = useState('txt2img');
      const [history, setHistory] = useState([]);
      const [config, setConfig] = useState(DEFAULT_CONFIG);
      const [showSettings, setShowSettings] = useState(false);
      const [toast, setToast] = useState({ show: false, message: '', type: 'info' });

      // New state for SuperTask persistence
      const [superTaskState, setSuperTaskState] = useState({
        globalRefs: [],
        subTasks: [{ id: 1, prompt: '', localRefs: [] }],
        settings: { size: '2K' }
      });

      const [editingTask, setEditingTask] = useState(null);
      const [transferData, setTransferData] = useState(null);

      // --- DRAFT PERSISTENCE ---
      // We store the state of each tab here so it survives tab switching
      const [tabDrafts, setTabDrafts] = useState({
        txt2img: { prompt: "", settings: { size: "2K", ratio: "1:1" } },
        img2img: { refs: [], prompt: "", settings: { size: "2K", ratio: "1:1" }, customPicRatio: null },
        inpaint: { baseImage: null, points: [], settings: { size: "2K", ratio: "ORIGINAL" }, activePoint: null }
      });

      const updateDraft = (tab, newData) => {
        setTabDrafts(prev => ({ ...prev, [tab]: { ...prev[tab], ...newData } }));
      };

      const showToast = (message, type = 'info') => { setToast({ show: true, message, type }); };
      const addToHistory = (item) => { setHistory(prev => [item, ...prev]); };
      const updateHistory = (id, newProps) => { setHistory(prev => prev.map(item => item.id === id ? { ...item, ...newProps } : item)); };
      const deleteHistory = (id) => { setHistory(prev => prev.filter(item => item.id !== id)); showToast("任务已删除"); };

      // IMPORTANT FIX: handleRerun now uses runTaskWithRetry to ensure automatic restarts
      // And properly extracts refs from history item
      const handleRerun = async (task) => {
        showToast("正在原地重启任务...");
        // Reset status
        updateHistory(task.id, { status: 'generating', progress: 0 });

        try {
          // Extract data based on task type
          let prompt = task.prompt;
          let ratio = "1:1";
          let size = "2K";
          let urls = [];

          if (task.type === 'txt2img') {
            // FIX: Explicitly restore ratio from saved settings
            ratio = task.settings?.ratio || "1:1";
            size = task.settings?.size || "2K";
            urls = [];
          } else if (task.type === 'img2img') {
            // FIX: Explicitly restore ratio from saved settings
            ratio = task.settings?.ratio || "1:1";
            if (ratio === "PIC") ratio = "1:1"; // Fallback if exact ratio lost
            size = task.settings?.size || "2K";
            urls = task.extraData?.refs || [];
          } else if (task.type === 'inpaint_step') {
            urls = task.extraData?.refs || [];
            if (urls.length === 0 && task.extraData?.baseImageUrl) {
              urls = [task.extraData.baseImageUrl];
            }
            // FIX: Use saved settings first, fallback to original dims if available
            if (task.settings && task.settings.ratio !== "ORIGINAL") {
              ratio = task.settings.ratio;
              size = task.settings.size || "2K";
            } else if (task.extraData?.baseImageDims) {
              ratio = `${task.extraData.baseImageDims.width}:${task.extraData.baseImageDims.height}`;
            }
          }

          // Use runTaskWithRetry for automatic 10x retry
          const { url, taskId } = await runTaskWithRetry(
            () => submitDrawTask(prompt, ratio, size, urls, config),
            (id) => pollTaskResult(id, (p) => updateHistory(task.id, { progress: p }), config),
            10,
            (attempt) => showToast(`自动重试 ${attempt}/10`, "info")
          );

          const isMock = taskId.toString().startsWith("mock-");
          updateHistory(task.id, { url, status: 'success', isMock, prompt: prompt }); // Restore prompt text without "retry" suffix

        } catch (e) {
          showToast("重启失败: " + e.message, "error");
          updateHistory(task.id, { status: 'failed', prompt: `失败: ${e.message}` });
        }
      };

      const handleBatchRerun = (tasksToRerun) => {
        if (!tasksToRerun || tasksToRerun.length === 0) return;
        showToast(`批量重启 ${tasksToRerun.length} 个任务...`);
        // Process sequentially or just fire off
        tasksToRerun.forEach(task => handleRerun(task));
      };

      const handleCopy = async (task) => {
        showToast("正在复制任务并重新提交...");
        const tempId = Date.now();
        let newExtraData = task.extraData ? JSON.parse(JSON.stringify(task.extraData)) : {};

        // Ensure refs preserved for copy
        if (task.type === 'img2img' && !newExtraData.refs) newExtraData.refs = [];

        // FIX: Ensure settings (ratio/size) are copied to new task history
        addToHistory({
          ...task,
          id: tempId,
          date: new Date(),
          status: 'generating',
          progress: 0,
          extraData: newExtraData,
          settings: task.settings // IMPORTANT: Carry over settings
        });

        try {
          // Logic similar to handleRerun but for a new ID
          let urls = [];
          let prompt = task.prompt;
          let aspectRatio = "1:1";
          let imageSize = "2K";

          if (task.type === 'img2img') {
            urls = task.extraData?.refs || [];
            // Logic Update: Prefer the saved ratio in settings which should be explicit now
            aspectRatio = task.settings?.ratio === "PIC" ? "1:1" : task.settings?.ratio || "1:1";
            imageSize = task.settings?.size || "2K";
          } else if (task.type === 'txt2img') {
            aspectRatio = task.settings?.ratio || "1:1";
            imageSize = task.settings?.size || "2K";
          } else if (task.type === 'inpaint_step') {
            urls = task.extraData?.refs || [];
            // Logic matching handleRerun
            if (task.settings && task.settings.ratio !== "ORIGINAL") {
              aspectRatio = task.settings.ratio;
              imageSize = task.settings.size || "2K";
            } else if (task.extraData?.baseImageDims) {
              aspectRatio = `${task.extraData.baseImageDims.width}:${task.extraData.baseImageDims.height}`;
            }
          }

          const { url, taskId } = await runTaskWithRetry(
            () => submitDrawTask(prompt, aspectRatio, imageSize, urls, config),
            (id) => pollTaskResult(id, (p) => updateHistory(tempId, { progress: p }), config),
            10,
            (attempt) => showToast(`自动重试 ${attempt}/10`, "info")
          );

          const isMock = taskId.toString().startsWith("mock-");
          updateHistory(tempId, { url, status: 'success', isMock, prompt: prompt });
        } catch (e) { showToast("复制失败: " + e.message, "error"); updateHistory(tempId, { status: 'failed' }); }
      };

      const handleEdit = (task) => {
        setEditingTask(task);
        setTab(task.type === 'inpaint_step' ? 'inpaint' : task.type);
        showToast("已还原任务内容");
      };
      const handleSendToImg2Img = (url) => { setTransferData({ target: 'img2img', payload: url }); setTab('img2img'); };
      const handleSendToInpaint = (url) => { setTransferData({ target: 'inpaint', payload: url }); setTab('inpaint'); };

      const handleBatchDownload = async (tasksToDownload = null) => {
        const source = (Array.isArray(tasksToDownload) && tasksToDownload.length > 0) ? tasksToDownload : history;
        const successes = source.filter(h => h.status === 'success' && h.url);

        if (successes.length === 0) return showToast("没有可下载的成功任务", "error");

        showToast(`开始批量下载 ${successes.length} 张图片，请允许弹窗...`);

        for (const item of successes) {
          const link = document.createElement('a');
          link.href = item.url;
          link.download = `result_${item.id}.png`;
          link.target = '_blank'; // Needed for some browsers to trigger download for cross-origin
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          await new Promise(r => setTimeout(r, 1000)); // Increased Delay to 1000ms
        }
      };

      const handleCopyLink = (url) => {
        if (!url) return;
        window.open(url, '_blank');
      };

      return (
        <div className="h-full w-full max-w-md mx-auto bg-gray-50 shadow-2xl relative flex flex-col overflow-hidden safe-area-top-spacer">
          <Header onSettings={() => setShowSettings(true)} />
          <main className="flex-1 relative w-full overflow-hidden">
            {activeTab === 'txt2img' && (
              <Txt2Img
                addToHistory={addToHistory}
                updateHistory={updateHistory}
                config={config}
                showToast={showToast}
                editingTask={editingTask}
                onTaskLoaded={() => setEditingTask(null)}
                draft={tabDrafts.txt2img}
                updateDraft={(d) => updateDraft('txt2img', d)}
              />
            )}
            {activeTab === 'img2img' && (
              <Img2Img
                addToHistory={addToHistory}
                updateHistory={updateHistory}
                config={config}
                showToast={showToast}
                editingTask={editingTask}
                onTaskLoaded={() => setEditingTask(null)}
                transferData={transferData}
                onConsumeTransfer={() => setTransferData(null)}
                draft={tabDrafts.img2img}
                updateDraft={(d) => updateDraft('img2img', d)}
              />
            )}
            {activeTab === 'supertask' && <SuperTaskMode addToHistory={addToHistory} updateHistory={updateHistory} config={config} showToast={showToast} state={superTaskState} setState={setSuperTaskState} />}
            {activeTab === 'inpaint' && (
              <InpaintMode
                addToHistory={addToHistory}
                updateHistory={updateHistory}
                historyItems={history}
                config={config}
                showToast={showToast}
                transferData={transferData}
                onConsumeTransfer={() => setTransferData(null)}
                editingTask={editingTask}
                onTaskLoaded={() => setEditingTask(null)}
                draft={tabDrafts.inpaint}
                updateDraft={(d) => updateDraft('inpaint', d)}
              />
            )}
            {activeTab === 'history' && <HistoryView history={history} onRerun={handleRerun} onCopy={handleCopy} onEdit={handleEdit} onDelete={deleteHistory} onSendToImg2Img={handleSendToImg2Img} onSendToInpaint={handleSendToInpaint} onBatchDownload={handleBatchDownload} onCopyLink={handleCopyLink} onBatchRerun={handleBatchRerun} showToast={showToast} />}
          </main>
          <TabBar activeTab={activeTab} setTab={setTab} />
          <SettingsModal isOpen={showSettings} onClose={() => setShowSettings(false)} config={config} setConfig={setConfig} />
          <Toast show={toast.show} message={toast.message} type={toast.type} onClose={() => setToast(prev => ({ ...prev, show: false }))} />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
